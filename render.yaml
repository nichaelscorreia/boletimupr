# Um serviço por usina; cada um publica a sua pasta (rootDir).
services:
  # --- Usina Porto Rico (UPR) ---
  - type: web
    name: boletim-online-moagem
    runtime: node
    rootDir: UPR
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ORACLE_SAFRA
        value: "54"
      - key: BOLETIM_API_URL
        value: http://nstech.ddns.net:8086/boletim-api
      - key: BOLETIM_API_SECRET
        sync: false # informe no painel do Render (não versionar)
      - key: ACESSO_CODIGO_LIBERACAO
        sync: false # código do seu primeiro acesso como administrador (não versionar)
      - key: ANTHROPIC_API_KEY
        sync: false # chave da API do Claude para o assistente de dados (não versionar)
